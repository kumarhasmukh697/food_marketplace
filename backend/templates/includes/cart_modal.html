   <!-- ==================== CART MODAL ==================== -->
<div id="cart-modal" class="hidden fixed inset-0 bg-black/60 z-[200] flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl w-full max-w-lg max-h-[90vh] flex flex-col overflow-hidden">

        <!-- Header -->
        <div class="px-6 py-5 border-b flex items-center justify-between">
            <div class="flex items-center gap-3">
                <i class="fa-solid fa-shopping-cart text-orange-500 text-xl"></i>
                <h2 class="text-2xl font-semibold"> Your Cart</h2>
                <span id="cart-modal-count"  class="bg-orange-100 text-orange-600 text-xs font-bold px-2.5 py-1 rounded-full">0 items</span>
            </div>
            <button onclick="closeCartModal()" class="text-3xl leading-none text-gray-400 hover:text-gray-600">×</button>
        </div>


        <!-- Cart Items -->
        <div id="cart-items-container" class="flex-1 overflow-y-auto p-6 space-y-5">
            <!-- JavaScript will populate cart items here -->
            <div id="cart-loading" class="text-center py-10 text-gray-500">
                <i class="fa-solid fa-spinner fa-spin text-2xl mb-3"></i>
                <p>Loading cart...</p>
            </div>
        </div>


        <!-- Footer / Bill Summary -->
        <div class="border-t p-6 bg-gray-50">
            <div class="space-y-2 mb-5 text-sm">
                <!-- Item Total -->
                <div class="flex justify-between">
                    <span class="text-gray-500"> Item Total</span>
                    <span id="cart-item-total"> ₹0.00</span>
                </div>


                <!-- Delivery Fee -->
                <div class="flex justify-between">
                    <span class="text-gray-500"> Delivery Fee</span>
                    <span id="cart-delivery-fee"> ₹40.00</span>
                </div>


                <!-- Taxes -->
                <div class="flex justify-between">
                    <span class="text-gray-500">Taxes</span>
                    <span id="cart-taxes"> ₹0.00</span>
                </div>


                <!-- Grand Total -->
                <div class="flex justify-between text-lg font-semibold pt-2 border-t">
                    <span> Grand Total</span>
                    <span id="cart-grand-total" class="text-orange-600"> ₹0.00</span>
                </div>
            </div>
            <button onclick="openCheckoutModal()" id="checkout-button" class="w-full py-4 bg-orange-500 hover:bg-orange-600 text-white rounded-3xl font-semibold text-lg">  Proceed to Checkout</button>
        </div>
    </div>
</div>
