<!-- profile model -->
<div id="profile-modal" class="hidden fixed inset-0 bg-black/60 z-[200] flex items-center justify-center">
    <div class="bg-white rounded-3xl w-full max-w-xl max-h-[100vh] overflow-hidden">
        <!-- Modal Header -->
        <div class="px-8 py-6 border-b flex items-center justify-between">
            <div class="flex items-center gap-4">
                <div id="profile-avatar" class="w-10 h-10 bg-orange-100 rounded-xl overflow-hidden">
                    <img src="https://picsum.photos/id/64/128/128" class="w-full h-full object-cover">
                </div>
                <div>
                    <h2 id="profile-name" class="text-xl font-semibold">Alex Rivera</h2>
                    <p id="profile-subtitle" class="text-gray-500">Customer since 2024</p>
                </div>
            </div>
            <button onclick="closeProfileModal()" class="text-3xl text-gray-400 hover:text-gray-600">×</button>
        </div>

        <div class="p-8 overflow-auto" style="max-height: calc(90vh - 140px)">
            <!-- Role-specific Profile Content -->
        {% if user.role == 'customer' %}
            {% include 'customer/profile.html' %}
        {% elif user.role == 'vendor' %}
            {% include 'vendor/profile.html' %}
        {% elif user.role == 'delivery' %}
            {% include 'delivery/profile.html' %}
        {% endif %}
        </div>

        <div class="border-t p-6 flex gap-4">
            <button onclick="closeProfileModal()" 
                    class="flex-1 py-4 border border-gray-300 rounded-3xl font-medium hover:bg-gray-50">
                Cancel
            </button>
            <button onclick="saveProfile()" 
                    class="flex-1 py-4 bg-orange-600 text-white rounded-3xl font-semibold hover:bg-orange-700">
                Save Changes
            </button>
        </div>
    </div>
</div>
