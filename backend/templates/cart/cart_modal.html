<!-- ==================== CART MODAL ==================== -->
<div id="cart-modal" class="hidden fixed inset-0 bg-black/60 z-[200] flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl w-full max-w-lg max-h-[90vh] flex flex-col overflow-hidden">

        <!-- Header -->
        <div class="px-6 py-5 border-b flex items-center justify-between">
            <div class="flex items-center gap-3">
                <i class="fa-solid fa-shopping-cart text-orange-500 text-xl"></i>
                <h2 class="text-2xl font-semibold">Your Cart</h2>
                <span class="bg-orange-100 text-orange-600 text-xs font-bold px-2.5 py-1 rounded-full">3 items</span>
            </div>
            <button onclick="closeCartModal()" class="text-3xl leading-none text-gray-400 hover:text-gray-600">×</button>
        </div>

        <!-- Cart Items (scrollable) -->
        <div class="flex-1 overflow-y-auto p-6 space-y-5">

            <!-- Cart Item 1 -->
            <div class="flex gap-4">
                <img src="https://picsum.photos/id/292/120/120" class="w-20 h-20 object-cover rounded-2xl">
                <div class="flex-1">
                    <h3 class="font-semibold">Butter Chicken</h3>
                    <p class="text-sm text-gray-500">Spice Garden</p>
                    <div class="flex items-center justify-between mt-3">
                        <div class="flex items-center gap-3">
                            <button class="w-8 h-8 rounded-full border border-gray-300 flex items-center justify-center text-lg">−</button>
                            <span class="font-medium">2</span>
                            <button class="w-8 h-8 rounded-full border border-gray-300 flex items-center justify-center text-lg">+</button>
                        </div>
                        <p class="font-semibold text-orange-600">₹640</p>
                    </div>
                </div>
            </div>

            <!-- Cart Item 2 -->
            <div class="flex gap-4">
                <img src="https://picsum.photos/id/431/120/120" class="w-20 h-20 object-cover rounded-2xl">
                <div class="flex-1">
                    <h3 class="font-semibold">Paneer Tikka Masala</h3>
                    <p class="text-sm text-gray-500">Spice Garden</p>
                    <div class="flex items-center justify-between mt-3">
                        <div class="flex items-center gap-3">
                            <button class="w-8 h-8 rounded-full border border-gray-300 flex items-center justify-center text-lg">−</button>
                            <span class="font-medium">1</span>
                            <button class="w-8 h-8 rounded-full border border-gray-300 flex items-center justify-center text-lg">+</button>
                        </div>
                        <p class="font-semibold text-orange-600">₹280</p>
                    </div>
                </div>
            </div>

            <!-- Cart Item 3 -->
            <div class="flex gap-4">
                <img src="https://picsum.photos/id/312/120/120" class="w-20 h-20 object-cover rounded-2xl">
                <div class="flex-1">
                    <h3 class="font-semibold">Garlic Naan</h3>
                    <p class="text-sm text-gray-500">Spice Garden</p>
                    <div class="flex items-center justify-between mt-3">
                        <div class="flex items-center gap-3">
                            <button class="w-8 h-8 rounded-full border border-gray-300 flex items-center justify-center text-lg">−</button>
                            <span class="font-medium">3</span>
                            <button class="w-8 h-8 rounded-full border border-gray-300 flex items-center justify-center text-lg">+</button>
                        </div>
                        <p class="font-semibold text-orange-600">₹180</p>
                    </div>
                </div>
            </div>

        </div>

        <!-- Footer / Bill Summary -->
        <div class="border-t p-6 bg-gray-50">
            <div class="space-y-2 mb-5 text-sm">
                <div class="flex justify-between">
                    <span class="text-gray-500">Item Total</span>
                    <span>₹1,100</span>
                </div>
                <div class="flex justify-between">
                    <span class="text-gray-500">Delivery Fee</span>
                    <span>₹40</span>
                </div>
                <div class="flex justify-between">
                    <span class="text-gray-500">Taxes</span>
                    <span>₹55</span>
                </div>
                <div class="flex justify-between text-lg font-semibold pt-2 border-t">
                    <span>Grand Total</span>
                    <span class="text-orange-600">₹1,195</span>
                </div>
            </div>

            <button onclick="openCheckoutModal()" class="w-full py-4 bg-orange-500 hover:bg-orange-600 text-white rounded-3xl font-semibold text-lg">
                Proceed to Checkout
            </button>
        </div>
    </div>
</div>
