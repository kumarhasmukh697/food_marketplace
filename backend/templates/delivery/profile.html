<form id="delivery-profile-form" enctype="multipart/form-data">

    <div id="profile-delivery-content">

        <h3 class="font-semibold text-lg mb-6"> Delivery Partner Details</h3>

        <!-- Profile Picture -->
        <div class="mt-8">
            <label class="block text-sm text-gray-500 mb-2">Profile Picture</label>

            <div class="flex items-center gap-5 rounded-3xl border border-gray-300 px-5 py-4">

                <!-- Preview -->
                <div class="relative shrink-0">
                    <img id="profile-preview" src="https://via.placeholder.com/96?text=Profile" alt="Profile Preview" class="h-24 w-24 rounded-2xl border border-gray-200 object-cover">
                </div>

                <!-- Upload -->
                <div class="min-w-0">
                    <label for="profile_picture" class="inline-flex cursor-pointer items-center rounded-2xl border border-gray-300 px-4 py-2.5 text-sm font-medium text-gray-700 hover:bg-gray-50"> Choose Picture </label>

                    <input
                        id="profile_picture"
                        name="profile_picture"
                        type="file"
                        accept="image/png,image/jpeg,image/webp"
                        class="hidden"
                        onchange="previewProfilePicture(event)"
                    >

                    <p
                        id="profile-picture-name"
                        class="mt-2 truncate text-xs text-gray-400">

                        PNG, JPG, WEBP supported

                    </p>

                </div>

            </div>
        </div>

        <!-- Name -->
        <div class="mt-8 grid grid-cols-2 gap-6">

            <div>
                <label class="block text-sm text-gray-500 mb-1">
                    First Name
                </label>

                <input
                    type="text"
                    name="first_name"
                    class="w-full border border-gray-300 rounded-2xl px-5 py-3"
                >
            </div>

            <div>
                <label class="block text-sm text-gray-500 mb-1">
                    Last Name
                </label>

                <input
                    type="text"
                    name="last_name"
                    class="w-full border border-gray-300 rounded-2xl px-5 py-3"
                >
            </div>

        </div>

        <!-- Phone + Vehicle -->
        <div class="mt-8 grid grid-cols-2 gap-6">

            <div>

                <label class="block text-sm text-gray-500 mb-1">
                    Phone Number
                </label>

                <input
                    type="tel"
                    name="phone_number"
                    class="w-full border border-gray-300 rounded-2xl px-5 py-3"
                >

            </div>

            <div>

                <label class="block text-sm text-gray-500 mb-1">
                    Vehicle Type
                </label>

                <select
                    name="vehicle_type"
                    class="w-full border border-gray-300 rounded-2xl px-5 py-3">

                    <option value="bike">Bike</option>
                    <option value="scooter">Scooter</option>
                    <option value="bicycle">Bicycle</option>

                </select>

            </div>

        </div>

        <!-- Vehicle Number -->
        <div class="mt-6">

            <label class="block text-sm text-gray-500 mb-1">
                Vehicle Number
            </label>

            <input
                type="text"
                name="vehicle_number"
                class="w-full border border-gray-300 rounded-2xl px-5 py-3"
            >

        </div>

        <!-- Driving License -->
        <div class="mt-6">

            <label class="block text-sm text-gray-500 mb-1">
                Driving License Number
            </label>

            <input
                type="text"
                name="driving_license_number"
                class="w-full border border-gray-300 rounded-2xl px-5 py-3"
            >

        </div>

        <!-- Address -->
        <div class="mt-6">

            <label class="block text-sm text-gray-500 mb-1">
                Address
            </label>

            <textarea
                name="address_line_1"
                class="w-full border border-gray-300 rounded-3xl px-5 py-4 h-24"></textarea>

        </div>


        <!-- City / State -->
        <div class="mt-8 grid grid-cols-2 gap-6">

            <div>

                <label class="block text-sm text-gray-500 mb-1">
                    City
                </label>

                <input
                    type="text"
                    name="city"
                    class="w-full border border-gray-300 rounded-2xl px-5 py-3"
                >

            </div>

            <div>

                <label class="block text-sm text-gray-500 mb-1">
                    State
                </label>

                <input
                    type="text"
                    name="state"
                    class="w-full border border-gray-300 rounded-2xl px-5 py-3"
                >

            </div>

        </div>

        <!-- Pincode -->
        <div class="mt-8">

            <label class="block text-sm text-gray-500 mb-1">
                Pincode
            </label>

            <input
                type="text"
                name="pincode"
                class="w-full border border-gray-300 rounded-2xl px-5 py-3"
            >

        </div>

        <!-- Statistics -->
        <div class="mt-8 grid grid-cols-2 gap-6">

            <div class="bg-orange-50 rounded-3xl p-6">

                <div class="text-sm text-gray-500">
                    Total Deliveries
                </div>

                <div
                    id="total_deliveries"
                    class="text-3xl font-bold mt-2">

                    0

                </div>

            </div>

            <div class="bg-emerald-50 rounded-3xl p-6">

                <div class="text-sm text-gray-500">
                    Rating
                </div>

                <div
                    id="rating"
                    class="text-3xl font-bold mt-2">

                    ⭐ 5.0

                </div>

            </div>

        </div>

    </div>

</form>
