{% extends 'auth_base.html' %}
{% load static %}

{% block title %}Verify OTP • FoodHub{% endblock %}

{% block content %}
    <h1 class="form-title">Verify Your Account</h1>
    <p class="form-subtitle">Enter the 6-digit OTP sent to your email</p>

    <form id="otp-form" class="sign-form">
        {% csrf_token %}

        <label for="otp">OTP <span class="star-required">*</span></label>
        <input type="text" id="otp" name="otp" maxlength="6" placeholder="Enter OTP" required>

        <input type="submit" value="Verify OTP" id="submit">

        <p class="have-account-line">
            Didn't receive the code? <a href="#">Resend OTP</a>
        </p>
    </form>
{% endblock %}

{% block extra_js %}
<script src="{% static 'js/accounts/verify-otp.js' %}"></script>
{% endblock %}
