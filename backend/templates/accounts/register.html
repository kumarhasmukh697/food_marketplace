{% extends 'auth_base.html' %}
{% load static %}

{% block title %}Register • FoodHub{% endblock %}

{% block content %}
    <h1 class="form-title">Create Account</h1>
    <p class="form-subtitle">Join FoodHub today</p>

    <form action="" method="post" id="sign-form" autocomplete="on">
        {% csrf_token %}

        <label for="username">Username <span class="star-required">*</span></label>
        <input type="text" name="username" id="username" placeholder="Choose a username" autofocus required>

        <label for="email">Email <span class="star-required">*</span></label>
        <input type="email" name="email" id="email" placeholder="mail@website.com" required>

        <label for="password">Password <span class="star-required">*</span></label>
        <input type="password" name="password" id="password" placeholder="Create a strong password" required>

        <label for="role">Register as <span class="star-required">*</span></label>
        <select name="role" id="role" required>
            <option value="customer">Customer</option>
            <option value="vendor">Vendor</option>
            <option value="delivery">Delivery Partner</option>
        </select>

        <input type="submit" value="Sign Up" id="submit">

        <p class="have-account-line">
            Already have an account? <a href="{% url 'login-page' %}">Sign In</a>
        </p>
    </form>
{% endblock %}

{% block extra_js %}
<script src="{% static 'js/accounts/register.js' %}"></script>
{% endblock %}
