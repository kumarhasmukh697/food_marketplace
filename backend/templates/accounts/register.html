{% extends 'auth_base.html' %}
{% load static %}

{% block title %}
 Register Page
{% endblock %}


{% block extra_css %}

{% endblock %}


{% block content %}
<div class="element">
    <form action="" method="post" class="sign-form" id="sign-form" autocomplete="on">
        <h1 class="form-title">Register to Food Marketplace</h1>
        <br>

        <label for="username">Username<span class="star-required">*</span></label>
        <input type="text" name="username" id="username" placeholder="Username" autofocus required>

        <label for="email">Email<span class="star-required">*</span></label>
        <input type="email" name="email" id="email" placeholder="mail@website.com" required>

        <label for="password">Password<span class="star-required">*</span></label>
        <input type="password" name="password" id="password" placeholder="Strong Password" required>
        
        <br>
        <label for="role">Register as:<span class="star-required">*</span></label>
        <select name="role" id="role" required>
            <option value="customer">Customer</option>
            <option value="vendor">Vendor</option>
            <option value="delivery">Delivery</option>
        </select>
        <br><br>
        <input type="submit" value="Sign Up" id="submit">

        <p class="have-account-line">Already have an Account? <a href="{% url 'login-page' %}">Sign in</a></p>

    </form>
</div>
{% endblock %}


{% block extra_js %}
<script src="{% static 'js/register.js' %}"></script>
{% endblock %}
