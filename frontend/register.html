<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
    <link rel="stylesheet" href="css/register.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alkatra&display=swap" rel="stylesheet">
    <title>Sign-Up-Form</title>
</head>
<body>
    <div class="container">
        <div class="element">
        <form action="" method="post" class="sign-form" id="sign-form" autocomplete="on">
            <h1 class="form-title">Register to Food Marketplace</h1>
            <br>

            <label for="username">Username<span class="star-required">*</span></label>
            <input type="text" name="username" id="username" placeholder="Username" autofocus required>

            <label for="email">Email<span class="star-required">*</span></label>
            <input type="email" name="email" id="email" placeholder="mail@website.com" required>

            <label for="password">Password<span class="star-required">*</span></label>
            <input type="password" name="password" id="password" placeholder="Strong Password" required>
           
            <br>
            <label for="role">Register as:<span class="star-required">*</span></label>
            <select name="role" id="role" required>
                <option value="customer">Customer</option>
                <option value="vendor">Vendor</option>
                <option value="delivery">Delivery</option>
            </select>
            <br><br>
            <input type="submit" value="Sign Up" id="submit">

            <p class="have-account-line">Already have an Account? <a href="">Sign in</a></p>

        </form>
        </div>
    </div>
</body>
</html>
<script src="js/register.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
